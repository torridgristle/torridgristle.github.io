<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Audio Jungle</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            min-height: 100%;
            margin: 0;
            background-color: #333;
        }

        .sound-button {
            width: 200px;
            height: 100px;
            margin: 20px;
            font-size: 2em;
            font-weight: bold;
            color: #000;
            background-color: #aaa;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sound-button:hover {
            background-color: #fff;
        }
    </style>
</head>
<body>
    <button class="sound-button" id="audiojungle_button">Audio Jungle</button>

    <script>
        const audiojungle = new Audio('audiojungle.mp3');
        const startbutton = document.getElementById('audiojungle_button');
        const status = document.getElementById('status');

        function playforever() {
            audiojungle.play().catch(error => console.error("audiojungle.play fucked up somehow", error));

            const min_time = 10;
            const max_time = 30;
            const random_time = Math.floor(Math.random() * (max_time - min_time + 1) + min_time);

            setTimeout(playforever, random_time * 1000);
        }

        startbutton.addEventListener('click', () => {
            startbutton.disabled = true;
            startbutton.textContent = "Audio Jungling";
            playforever();
        });
    </script>
</body>
</html>
