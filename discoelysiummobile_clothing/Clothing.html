<script>
    function ToggleClothes(clothes) {
        //const element = document.getElementById(clothes);
        const elements = document.querySelectorAll('#' + clothes);
        elements.forEach(el => {
            if (el.style.display === "none") {
                el.style.display = "block";
            } else {
            el.style.display = "none";
            }
        });
    }

    function StripClothes() {
        const elements = document.querySelectorAll("img.cloth_back, img.cloth_front");
        elements.forEach(el => {
            el.style.display = "none";
        });
    }

document.addEventListener("DOMContentLoaded", function() {
    StripClothes();
});
</script>
